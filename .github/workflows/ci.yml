name: ToolGuiZalo Pro V2 CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Syntax & Lint Checks
        run: npm run lint

      - name: Run Unit & Integration Tests
        run: npm test

      - name: Run 50k Performance Benchmark
        run: npm run test:perf
